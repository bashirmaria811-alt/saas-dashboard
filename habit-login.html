<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Habitify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(25px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .pop-in { animation: popIn 0.5s ease-out forwards; opacity: 0; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(8deg); }
    }
    .float-1 { animation: float 4s ease-in-out infinite; }
    .float-2 { animation: float 5s ease-in-out infinite; animation-delay: 0.5s; }
    .float-3 { animation: float 3.5s ease-in-out infinite; animation-delay: 1s; }
    .float-4 { animation: float 4.5s ease-in-out infinite; animation-delay: 1.5s; }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-100 min-h-screen relative overflow-hidden">

   <header class="flex flex-col sm:flex-row justify-between items-center bg-fuchsia-900 text-white px-4 sm:px-8 py-4 gap-2">
    <h1 class="text-xl sm:text-2xl font-bold">🌸 Habitify</h1>
    <nav class="space-x-4 sm:space-x-6 text-sm sm:text-base">
      <a href="habit-landing.html" class="hover:text-pink-300">Home</a>
      <a href="habit-dashboard.html" class="hover:text-pink-300">Dashboard</a>
      <a href="habit-login.html" class="text-pink-300 font-semibold border-b-2 border-pink-300">Login</a>
    </nav>
  </header>

  <!-- Floating decorations -->
  <div class="absolute top-24 left-10 text-5xl opacity-60 float-1">🌷</div>
  <div class="absolute top-40 right-16 text-4xl opacity-60 float-2">💗</div>
  <div class="absolute bottom-24 left-20 text-4xl opacity-60 float-3">✨</div>
  <div class="absolute bottom-16 right-24 text-5xl opacity-60 float-4">🌸</div>
  <div class="absolute top-1/2 left-6 text-3xl opacity-40 float-2">🦋</div>
  <div class="absolute top-1/3 right-8 text-3xl opacity-40 float-3">🌺</div>

  <div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-3xl shadow-lg pop-in relative z-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-fuchsia-900 pop-in delay-1">Welcome Back 🌷</h2>

    <form id="habitLoginForm">
      <label class="block mb-2 font-semibold text-purple-700 pop-in delay-2">Email</label>
      <div class="relative mb-4 pop-in delay-2">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg">📧</span>
        <input type="email" id="habitLoginEmail"
          class="w-full border border-pink-200 p-3 pl-11 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-400" required>
      </div>

      <label class="block mb-2 font-semibold text-purple-700 pop-in delay-3">Password</label>
      <div class="relative mb-4 pop-in delay-3">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg">🔒</span>
        <input type="password" id="habitLoginPassword"
          class="w-full border border-pink-200 p-3 pl-11 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-400" required>
      </div>

      <button type="submit" class="w-full bg-pink-500 text-white py-3 rounded-full hover:bg-pink-600 shadow-md pop-in delay-4">
        Login 💗
      </button>
    </form>
    <p id="habitLoginMsg" class="mt-4 text-center"></p>
  </div>

  <script src="habit-script.js"></script>
</body>
</html>
