<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MyApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <header class="flex justify-between items-center bg-slate-900 text-white px-8 py-4">
    <h1 class="text-2xl font-bold">MyApp</h1>
    <nav class="space-x-6">
      <a href="index.html" class="hover:text-indigo-400">Home</a>
      <a href="components.html" class="hover:text-indigo-400">Components</a>
      <a href="dashboard.html" class="text-indigo-400 font-semibold border-b-2 border-indigo-400">Dashboard</a>
    </nav>
  </header>

  <div class="max-w-6xl mx-auto p-8">
    <h2 class="text-3xl font-bold mb-2">User Dashboard</h2>
<p id="welcomeUser" class="text-gray-600 mb-6"></p>

    <!-- Loading message -->
    <p id="loadingMsg" class="text-gray-500">Loading users...</p>

    <!-- Users table -->
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded-xl shadow overflow-hidden">
        <thead class="bg-slate-800 text-white">
          <tr>
            <th class="text-left px-6 py-3">Name</th>
            <th class="text-left px-6 py-3">Email</th>
            <th class="text-left px-6 py-3">Company</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- JS se data yahan aayega -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
