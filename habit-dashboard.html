<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Habitify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(15px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .pop-in { animation: popIn 0.4s ease-out forwards; }
  </style>
  <script data-goatcounter="https://habitify-maria2.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-100 min-h-screen">

    <header class="flex flex-col sm:flex-row justify-between items-center bg-fuchsia-900 text-white px-4 sm:px-8 py-4 gap-2">
    <h1 class="text-xl sm:text-2xl font-bold">🌸 Habitify</h1>
    <div class="flex items-center gap-4">
      <span id="coinDisplay" class="bg-yellow-400 text-fuchsia-900 font-bold px-4 py-1.5 rounded-full text-sm sm:text-base">🪙 0</span>
      <nav class="space-x-4 sm:space-x-6 text-sm sm:text-base">
        <a href="habit-landing.html" class="hover:text-pink-300">Home</a>
        <a href="habit-dashboard.html" class="text-pink-300 font-semibold border-b-2 border-pink-300">Dashboard</a>
        <a href="habit-login.html" class="hover:text-pink-300">Login</a>
      </nav>
    </div>
  </header>

  <div class="max-w-3xl mx-auto p-8">
    <h2 class="text-3xl font-bold mb-2 text-fuchsia-900">My Habits 🌷</h2>
    <p id="welcomeUser" class="text-purple-600 mb-6"></p>

    <!-- Motivational Quote Box -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-6 border border-pink-100 text-center">
      <p id="quoteText" class="text-purple-700 italic">Loading today's motivation... ✨</p>
    </div>

    <!-- Weather Box -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-6 border border-pink-100 text-center">
      <p id="weatherText" class="text-purple-700">🌤️ Loading weather...</p>
    </div>
        <!-- Badges -->
    <div id="badgesRow" class="flex flex-wrap gap-2 mb-6"></div>
        <!-- Badges -->
    <div id="badgesRow" class="flex flex-wrap gap-2 mb-6"></div>

    <!-- Daily Spin Game -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-6 border border-pink-100 text-center">
      <p class="font-semibold text-fuchsia-900 mb-2">🎡 Daily Spin — Win Bonus Coins!</p>
      <div id="spinWheel" class="text-5xl mb-3 transition-transform duration-700">🎡</div>
      <button id="spinBtn" class="bg-pink-500 text-white px-6 py-2 rounded-full hover:bg-pink-600 shadow-md">Spin Now</button>
      <p id="spinMsg" class="text-purple-600 mt-2 text-sm"></p>
    </div>

    <!-- Mini Games -->
    <h3 class="text-xl font-bold text-fuchsia-900 mb-3">🎮 Mini Games</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

      <!-- Memory Match -->
      <div class="bg-white rounded-2xl shadow-md p-4 border border-pink-100 text-center">
        <p class="font-semibold text-fuchsia-900 mb-2 text-sm">🧠 Memory Match</p>
        <div id="memoryGrid" class="grid grid-cols-3 gap-2 mb-2"></div>
        <p id="memoryMsg" class="text-xs text-purple-500"></p>
      </div>

      <!-- Scratch Card -->
      <div class="bg-white rounded-2xl shadow-md p-4 border border-pink-100 text-center">
        <p class="font-semibold text-fuchsia-900 mb-2 text-sm">🎫 Scratch Card</p>
        <div class="relative w-full h-24 rounded-xl overflow-hidden mb-2">
          <div id="scratchPrize" class="absolute inset-0 flex items-center justify-center text-lg font-bold text-pink-600 bg-pink-50">?</div>
          <div id="scratchOverlay" class="absolute inset-0 bg-gradient-to-br from-purple-300 to-pink-300 flex items-center justify-center text-white text-sm cursor-pointer select-none">Scratch Me!</div>
        </div>
        <p id="scratchMsg" class="text-xs text-purple-500"></p>
      </div>

      <!-- Number Guess -->
      <div class="bg-white rounded-2xl shadow-md p-4 border border-pink-100 text-center">
        <p class="font-semibold text-fuchsia-900 mb-2 text-sm">🔢 Guess the Number (1-10)</p>
        <input id="guessInput" type="number" min="1" max="10" class="w-16 text-center border border-pink-200 rounded-full p-1 mb-2">
        <button id="guessBtn" class="bg-pink-500 text-white px-4 py-1 rounded-full text-sm hover:bg-pink-600 block mx-auto mb-2">Guess</button>
        <p id="guessMsg" class="text-xs text-purple-500"></p>
      </div>

    </div>

    <form id="addHabitForm" class="flex flex-col sm:flex-row gap-3 mb-8">
      <input type="text" id="habitName" placeholder="e.g. Drink Water" required
        class="flex-1 border border-pink-200 p-3 rounded-full px-5 focus:outline-none focus:ring-2 focus:ring-pink-400">
      <select id="habitCategory" class="border border-pink-200 p-3 rounded-full px-4">
        <option value="Health">Health</option>
        <option value="Study">Study</option>
        <option value="Fitness">Fitness</option>
        <option value="Other">Other</option>
      </select>
      <button type="submit" class="bg-pink-500 text-white px-5 py-3 rounded-full hover:bg-pink-600 shadow-md">
        Add Habit 💗
      </button>
    </form>

    <div id="habitList" class="space-y-3"></div>
  </div>

  <script src="habit-script.js"></script>
</body>
</html>
