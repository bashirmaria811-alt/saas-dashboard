<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components - MyApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Navbar Component -->
  <header class="flex justify-between items-center bg-slate-900 text-white px-8 py-4">
    <h1 class="text-2xl font-bold">MyApp</h1>
    <nav class="space-x-6">
  <a href="index.html" class="hover:text-indigo-400">Home</a>
  <a href="components.html" class="text-indigo-400 font-semibold border-b-2 border-indigo-400">Components</a>
  <a href="dashboard.html" class="hover:text-indigo-400">Dashboard</a>
    </nav>
  </header>

  <div class="max-w-6xl mx-auto p-8">
    <h2 class="text-3xl font-bold mb-6">Reusable UI Components</h2>

    <!-- Buttons -->
    <section class="mb-10">
      <h3 class="text-xl font-semibold mb-4">Buttons</h3>
      <div class="space-x-4">
        <button class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700">Primary</button>
        <button class="bg-gray-200 text-gray-800 px-5 py-2 rounded-lg hover:bg-gray-300">Secondary</button>
        <button class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">Danger</button>
      </div>
    </section>

    <!-- Cards -->
    <section class="mb-10">
      <h3 class="text-xl font-semibold mb-4">Cards</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-xl shadow p-6">
          <h4 class="font-bold text-lg mb-2">Total Users</h4>
          <p class="text-3xl font-bold text-indigo-600">1,204</p>
        </div>
        <div class="bg-white rounded-xl shadow p-6">
          <h4 class="font-bold text-lg mb-2">Revenue</h4>
          <p class="text-3xl font-bold text-green-600">$8,540</p>
        </div>
        <div class="bg-white rounded-xl shadow p-6">
          <h4 class="font-bold text-lg mb-2">Active Sessions</h4>
          <p class="text-3xl font-bold text-orange-500">312</p>
        </div>
      </div>
    </section>
  </div>

</body>
</html>
